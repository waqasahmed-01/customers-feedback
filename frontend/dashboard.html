<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#"> Customer Feedback System </a>

        <div class="d-flex">
          <a href="dashboard.html" class="btn btn-light me-2"> Dashboard </a>

          <a href="send-feedback.html" class="btn btn-light me-2">
            Send Feedback
          </a>

          <button class="btn btn-danger" id="logoutBtn">Logout</button>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <h2 class="mb-4">Dashboard Overview</h2>

      <div class="row g-4">
        <div class="col-md-3">
          <div class="card shadow-sm text-center">
            <div class="card-body">
              <h6>Total Customers</h6>

              <h2 id="customersCount">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm text-center">
            <div class="card-body">
              <h6>Total Invitations</h6>

              <h2 id="invitationCount">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm text-center">
            <div class="card-body">
              <h6>Completed</h6>

              <h2 id="completedCount">0</h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card shadow-sm text-center">
            <div class="card-body">
              <h6>Expired</h6>

              <h2 id="expiredCount">0</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mt-5">
        <div class="card-header">
          <h5 class="mb-0">Invitation History</h5>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Email</th>
                  <th>Status</th>
                  <th>Expires</th>
                </tr>
              </thead>

              <tbody id="invitationTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card shadow-sm mt-5 mb-5">
        <div class="card-header">
          <h5 class="mb-0">Feedback History</h5>
        </div>

        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Email</th>
                  <th>Rating</th>
                  <th>Comment</th>
                </tr>
              </thead>

              <tbody id="feedbackTable"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="./js/dashboard.js"></script>
  </body>
</html>
